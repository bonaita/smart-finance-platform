name: Mule CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build project
        run: mvn clean package

      - name: Run MUnit tests
        run: mvn test

      - name: Deploy to CloudHub
        run: |
          mvn deploy \
          -DmuleDeploy \
          -Danypoint.username=${{ secrets.ANYPOINT_USER }} \
          -Danypoint.password=${{ secrets.ANYPOINT_PASS }}